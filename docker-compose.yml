version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: impactconnect-db
    restart: always
    environment:
      POSTGRES_DB: impactconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: impactpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d impactconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js + Express + React Application
  impactconnect-app:
    build: .
    container_name: impactconnect-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:impactpassword@postgres:5432/impactconnect
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
